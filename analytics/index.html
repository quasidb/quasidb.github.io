<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics — QDB Trading Desk</title>
<meta name="description" content="Live pair and index dashboards — FX and Indices with price ladder, crowd positioning and QDB Score.">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%231d3f61%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22none%22%20stroke%3D%22%239fd0ee%22%20stroke-width%3D%224%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2CHelvetica%2Csans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2234%22%20fill%3D%22%23ffffff%22%3EQ%3C/text%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2213%22%20r%3D%227%22%20fill%3D%22%239fd0ee%22%20stroke%3D%22%231d3f61%22%20stroke-width%3D%223%22/%3E%3C/svg%3E">
<script data-goatcounter="https://quasidb.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preload" href="../fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:optional;src:url(../fonts/space-grotesk-latin.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:optional;src:url(../fonts/jetbrains-mono-latin.woff2) format('woff2')}
:root{
  --bg:#0b0f17; --bg2:#101624; --panel:#141b2b; --line:#232d42;
  --text:#e8edf6; --muted:#93a0b8; --dim:#5f6b82;
  --buy:#22c55e; --sell:#ef4444; --accent:#f5b83d; --accent2:#3b82f6;
  --radius:16px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo-mark{width:42px;height:42px;border-radius:50%;flex:none;background:#1d3f61}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin:24px 0 8px}
.sub{color:var(--muted);margin-bottom:32px}
.section-title{font-size:20px;font-weight:700;margin:32px 0 12px;display:flex;align-items:center;gap:12px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:24px}
.pair-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 6px;text-align:center;font-family:var(--mono);font-weight:600;font-size:15px;cursor:pointer;transition:all .15s;color:#ffffff}
.pair-btn:hover{border-color:var(--accent);background:rgba(245,184,61,.08);color:#ffffff}
.pair-btn.index{border-color:rgba(59,130,246,.5);color:#ffffff}
.pair-btn.aud{border-left:4px solid #f59e0b}
.pair-btn.cad{border-left:4px solid #ef4444}
.pair-btn.chf{border-left:4px solid #8b5cf6}
.pair-btn.eur{border-left:4px solid #3b82f6}
.pair-btn.gbp{border-left:4px solid #10b981}
.pair-btn.jpy{border-left:4px solid #ec4899}
.pair-btn.nzd{border-left:4px solid #06b6d4}
.pair-btn.usd{border-left:4px solid #64748b}
.viewer{display:none}
.viewer.active{display:block}
.toolbar{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.back-btn{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.pair-title{font-size:28px;font-weight:700;font-family:var(--mono)}

/* Dashboard header */
.dash-header{background:linear-gradient(90deg,#1e3a5f,#141b2b);padding:18px 24px;border-radius:14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;border:1px solid #2a3a5a}
.price-block{display:flex;flex-direction:column}
.price-label{font-size:12px;color:var(--muted);letter-spacing:.5px}
.price-big{font-family:var(--mono);font-size:36px;font-weight:700;line-height:1.1}
.change{font-family:var(--mono);font-size:20px;font-weight:600}
.change.up{color:var(--buy)}.change.down{color:var(--sell)}
.score-pill{background:#1a2332;padding:8px 16px;border-radius:24px;font-family:var(--mono);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.bias{font-weight:700;font-size:16px}

/* Grid */
.dash-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:16px;margin-bottom:16px}
@media(max-width:1000px){.dash-grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;overflow:hidden}
.panel h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--accent)}

/* Ladder */
.ladder table{width:100%;font-family:var(--mono);font-size:13px;border-collapse:collapse}
.ladder th{text-align:left;color:var(--dim);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
.ladder td{padding:5px 4px;border-bottom:1px solid rgba(35,45,66,.4)}
.ladder tr.price-here{background:rgba(245,184,61,.22);font-weight:700}
.ladder tr.price-here td{color:var(--accent)}
.ladder tr.above td:first-child{color:#f87171}
.ladder tr.below td:first-child{color:#4ade80}
.ladder .dist{text-align:right;font-variant-numeric:tabular-nums}
.ladder .price{text-align:right;font-variant-numeric:tabular-nums}

/* Crowd */
.crowd-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(35,45,66,.35);font-size:14px}
.crowd-row:last-child{border:none}
.crowd-row b{font-family:var(--mono);font-weight:600}
.crowd-row .buy{color:var(--buy)}
.crowd-row .sell{color:var(--sell)}

/* Chart */
.chart-box{height:220px;position:relative;margin:8px 0}

/* Legend */
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .res::before{background:#ef4444}
.legend .sup::before{background:#22c55e}
.legend .here::before{background:#f5b83d}

.loading,.error{text-align:center;padding:48px;color:var(--muted)}
.error{color:var(--sell);background:rgba(239,68,68,.08);border-radius:10px}
.footer{margin-top:48px;padding:20px 0;border-top:1px solid var(--line);color:var(--dim);font-size:13px;text-align:center}
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a href="/" class="logo"><span class="logo-mark" role="img" aria-label="QDB logo"></span>QDB Trading Desk</a>
    <a href="/" style="color:var(--muted);font-size:15px">← Home</a>
  </div>
</nav>
<div class="wrap">
  <h1>Analytics</h1>
  <p class="sub">Select a forex pair or index for the live dashboard view.</p>

  <div class="section-title">FX Pairs</div>
  <div id="fxMenu" class="menu"></div>

  <div class="section-title">Indices</div>
  <div id="indexMenu" class="menu"></div>

  <div id="viewer" class="viewer">
    <div class="toolbar">
      <button class="back-btn" id="backBtn">← Back to menu</button>
      <div class="pair-title" id="pairTitle"></div>
      <div class="status" id="status"></div>
    </div>
    <div id="dashboard"></div>
  </div>

  <div class="footer">FX + Indices dashboards · quasidb.com</div>
</div>

<script>
const FX = ['AUDCAD','AUDCHF','AUDJPY','AUDNZD','AUDUSD','CADCHF','CADJPY','CHFJPY','EURAUD','EURCAD','EURCHF','EURGBP','EURJPY','EURNZD','EURUSD','GBPAUD','GBPCAD','GBPCHF','GBPJPY','GBPNZD','GBPUSD','NZDCAD','NZDCHF','NZDJPY','NZDUSD','USDCAD','USDCHF','USDJPY'];
const INDICES = ['SPX500','US30','NAS100','UK100','GER40','FRA40','US2000'];

const BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTTWwh8vdvIjzOxGvIDCjR05tZtZwtOjwhpM25aUcgbv4wXuZezmMXkR5_jqxhKXNo713PbJXRH7YN0/pub';
const PUBLISHED_URLS = {
  'SPX500': BASE + '?gid=0&single=true&output=csv',
  'US30': BASE + '?gid=1295520178&single=true&output=csv',
  'NAS100': BASE + '?gid=1549744721&single=true&output=csv',
  'UK100': BASE + '?gid=1632370860&single=true&output=csv',
  'GER40': BASE + '?gid=408307758&single=true&output=csv',
  'FRA40': BASE + '?gid=2097298862&single=true&output=csv',
  'US2000': BASE + '?gid=2005171773&single=true&output=csv',
  'AUDCAD': BASE + '?gid=1016142867&single=true&output=csv',
  'AUDCHF': BASE + '?gid=952463102&single=true&output=csv',
  'AUDJPY': BASE + '?gid=98476169&single=true&output=csv',
  'AUDNZD': BASE + '?gid=1877855708&single=true&output=csv',
  'AUDUSD': BASE + '?gid=672364947&single=true&output=csv',
  'CADCHF': BASE + '?gid=519122340&single=true&output=csv',
  'CADJPY': BASE + '?gid=1020669219&single=true&output=csv',
  'CHFJPY': BASE + '?gid=1002553994&single=true&output=csv',
  'EURAUD': BASE + '?gid=1948454224&single=true&output=csv',
  'EURCAD': BASE + '?gid=1866147707&single=true&output=csv',
  'EURCHF': BASE + '?gid=2016210783&single=true&output=csv',
  'EURGBP': BASE + '?gid=744185477&single=true&output=csv',
  'EURJPY': BASE + '?gid=676608706&single=true&output=csv',
  'EURNZD': BASE + '?gid=173677714&single=true&output=csv',
  'EURUSD': BASE + '?gid=982406586&single=true&output=csv',
  'GBPAUD': BASE + '?gid=708669208&single=true&output=csv',
  'GBPCAD': BASE + '?gid=1800643929&single=true&output=csv',
  'GBPCHF': BASE + '?gid=794060753&single=true&output=csv',
  'GBPJPY': BASE + '?gid=777063313&single=true&output=csv',
  'GBPUSD': BASE + '?gid=479131026&single=true&output=csv',
  'NZDCAD': BASE + '?gid=1093561562&single=true&output=csv',
  'NZDCHF': BASE + '?gid=154565602&single=true&output=csv',
  'NZDJPY': BASE + '?gid=301104910&single=true&output=csv',
  'NZDUSD': BASE + '?gid=1830829538&single=true&output=csv',
  'USDCAD': BASE + '?gid=590361703&single=true&output=csv',
  'USDCHF': BASE + '?gid=852931922&single=true&output=csv',
  'USDJPY': BASE + '?gid=394480278&single=true&output=csv'
};

function buildMenus(){
  const fx = document.getElementById('fxMenu');
  const idx = document.getElementById('indexMenu');
  FX.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pair-btn';
    const base = p.slice(0,3).toLowerCase();
    if(['aud','cad','chf','eur','gbp','jpy','nzd','usd'].includes(base)) b.classList.add(base);
    b.textContent = p;
    b.onclick = () => showPair(p);
    fx.appendChild(b);
  });
  INDICES.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pair-btn index';
    b.textContent = p;
    b.onclick = () => showPair(p);
    idx.appendChild(b);
  });
}

function showMenu(){
  document.getElementById('fxMenu').style.display = 'grid';
  document.getElementById('indexMenu').style.display = 'grid';
  document.querySelectorAll('.section-title').forEach(el => el.style.display = 'flex');
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('dashboard').innerHTML = '';
  history.pushState(null,'','/analytics/');
}

function showPair(symbol){
  document.getElementById('fxMenu').style.display = 'none';
  document.getElementById('indexMenu').style.display = 'none';
  document.querySelectorAll('.section-title').forEach(el => el.style.display = 'none');
  document.getElementById('viewer').classList.add('active');
  document.getElementById('pairTitle').textContent = symbol;
  document.getElementById('status').textContent = 'Loading…';
  document.getElementById('dashboard').innerHTML = '<div class="loading">Building dashboard…</div>';
  history.pushState(null,'','/analytics/#'+symbol.toLowerCase());
  loadData(symbol);
}

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){ if(q && text[i+1]==='"'){cell+='"';i++;} else q=!q; }
    else if(c===',' && !q){ row.push(cell); cell=''; }
    else if((c==='\n'||c==='\r') && !q){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()));
}

async function loadData(symbol){
  const url = PUBLISHED_URLS[symbol];
  if(!url){
    renderDashboard(symbol, null);
    document.getElementById('status').textContent = 'No URL';
    return;
  }
  try {
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if(text.includes('<!DOCTYPE') || text.includes('Sign in')) throw new Error('Not a public CSV');
    const rows = parseCSV(text);
    renderDashboard(symbol, rows);
    document.getElementById('status').textContent = rows.length + ' rows loaded';
  } catch(e) {
    document.getElementById('status').textContent = '';
    document.getElementById('dashboard').innerHTML = `<div class="error">Could not load ${symbol}: ${e.message}</div>`;
  }
}

function findValue(rows, label){
  for(const r of rows){
    const joined = r.join('|').toLowerCase();
    if(joined.includes(label.toLowerCase())){
      for(let i=0;i<r.length;i++){
        if((r[i]||'').toLowerCase().includes(label.toLowerCase())){
          return (r[i+2] || r[i+1] || '').trim();
        }
      }
    }
  }
  return '';
}

function renderDashboard(symbol, rows){
  const isIndex = INDICES.includes(symbol);
  let price = '—', change = '—', score = '—', bias = '—', longPct = '—';
  let ladderHtml = '';
  let volumeHtml = '<div class="crowd-row"><span>Volume data</span><b>—</b></div>';
  let adrHtml = '<div class="crowd-row"><span>ADR</span><b>—</b></div>';

  if(rows && rows.length){
    // Header — exact positions (row 5 for both FX and Indices)
    const headerRow = rows[4] || [];
    price = (headerRow[3] || headerRow[2] || price).trim();
    change = (headerRow[5] || headerRow[4] || change).trim();
    score = (headerRow[7] || headerRow[6] || score).trim();
    bias = (headerRow[9] || headerRow[10] || bias).trim();
    const isIndexLayout = INDICES.includes(symbol);
    longPct = findValue(rows, 'Crowd long % (now)') || findValue(rows, 'Crowd long %') || longPct;

    // Ladder
    const ladder = [];
    let foundPrice = false;
    for(const r of rows){
      const level = (r[1]||r[0]||'').trim();
      const pr = (r[4]||'').trim();
      const dist = (r[5]||'').trim(); // E=price, F=distance
      if(!level || !pr) continue;
      const isPriceHere = /PRICE IS HERE|◀/i.test(level);
      const isLevel = /R\d|S\d|Pivot|Open|High|Low|BB|Breakeven|PRICE/i.test(level);
      if(isLevel || isPriceHere){
        let cls = isPriceHere ? 'price-here' : (foundPrice ? 'below' : 'above');
        if(isPriceHere) foundPrice = true;
        ladder.push(`<tr class="${cls}"><td>${level.replace(/◀\s*/,'')}</td><td class="price">${pr}</td><td class="dist">${dist}</td></tr>`);
        if(ladder.length > 28) break;
      }
    }
    ladderHtml = ladder.join('') || '<tr><td colspan="3">No ladder</td></tr>';

    // Volume / ADR / SSI extract
    if(isIndexLayout){
      // Indices use Crowd SSI instead of volume delta
      for(let i=0;i<rows.length;i++){
        const r = rows[i];
        if((r[1]||'').trim().toLowerCase().includes('ssi ratio')){
          volumeHtml = `<div class="crowd-row"><span>SSI ratio (now)</span><b>${(r[3]||'—').trim()}</b></div>
                         <div class="crowd-row"><span>Long % (now)</span><b>${longPct}</b></div>`;
          break;
        }
      }
      adrHtml = `<div class="crowd-row"><span>ADR (pts)</span><b>${findValue(rows,'ADR')||'—'}</b></div>`;
    } else {
      // FX volume
      for(let i=0;i<rows.length;i++){
        const r = rows[i];
        if((r[1]||'').trim().toLowerCase() === 'short volume'){
          const longR = rows[i+1] || [];
          volumeHtml = `<div class="crowd-row"><span>Short volume (live)</span><b>${(r[4]||'—').trim()}</b></div>
                         <div class="crowd-row"><span>Long volume (live)</span><b>${(longR[4]||'—').trim()}</b></div>
                         <div class="crowd-row"><span>Δ Day % (short)</span><b>${(r[6]||'—').trim()}</b></div>`;
          break;
        }
      }
      adrHtml = `<div class="crowd-row"><span>ADR (pips)</span><b>${findValue(rows,'ADR')||'—'}</b></div>
                  <div class="crowd-row"><span>% of ADR used</span><b>${findValue(rows,'% of ADR used')||'—'}</b></div>`;
    }
  }

  const changeClass = String(change).includes('-') ? 'down' : 'up';
  const html = `
    <div class="dash-header">
      <div class="price-block">
        <div class="price-label">${isIndex ? 'INDEX' : 'FX PAIR'}</div>
        <div class="price-big">${price}</div>
      </div>
      <div class="change ${changeClass}">${change}</div>
      <div class="score-pill">${score}</div>
      <div class="bias">${bias}</div>
    </div>

    <div class="dash-grid">
      <div class="panel ladder">
        <h3>🧭 Price Ladder — all key levels, sorted</h3>
        <table>
          <thead><tr><th>Level</th><th>Price</th><th class="dist">Distance</th></tr></thead>
          <tbody>${ladderHtml}</tbody>
        </table>
        <div class="legend">
          <span class="res">above = resistance</span>
          <span class="sup">below = support</span>
          <span class="here">amber = live price</span>
        </div>
      </div>

      <div>
        <div class="panel" style="margin-bottom:16px">
          <h3>👥 Crowd vs Price — contrarian read</h3>
          <div class="crowd-row"><span>Crowd long % (now)</span><b>${longPct}</b></div>
          <div class="crowd-row"><span>Contrarian bias</span><b class="${/bear/i.test(bias)?'sell':'buy'}">${bias}</b></div>
          <div class="crowd-row"><span>QDB Score</span><b>${score}</b></div>
        </div>
        <div class="panel" style="margin-bottom:16px">
          <h3>📊 Volume Delta</h3>
          ${volumeHtml}
        </div>
        <div class="panel">
          <h3>📏 Previous Day & ADR</h3>
          ${adrHtml}
        </div>
      </div>
    </div>

    
    <div class="dash-grid" style="margin-top:16px">
      <div class="panel">
        <h3>✅ Score Breakdown</h3>
        <div id="checksPanel" style="font-size:13px;line-height:1.7"></div>
      </div>
      <div>
        <div class="panel" style="margin-bottom:16px">
          <h3>📐 RSI & Bollinger</h3>
          <div id="rsiPanel"></div>
        </div>
        <div class="panel">
          <h3>🏦 Smart Money (COT)</h3>
          <div id="cotPanel"></div>
        </div>
      </div>
    </div>
<div class="panel" style="margin-top:16px">
      <h3>🍩 Score Overview</h3>
      <div class="chart-box"><canvas id="scoreChart"></canvas></div>
    </div>
  `;

  document.getElementById('dashboard').innerHTML = html;

  // Populate extra panels if data exists
  setTimeout(() => {
    const checks = document.getElementById('checksPanel');
    const rsi = document.getElementById('rsiPanel');
    const cot = document.getElementById('cotPanel');
    if(checks && rows){
      let items = [];
      let inChecks = false;
      for(const r of rows){
        const t = r.join(' ');
        if(t.includes('Score Breakdown')) { inChecks = true; continue; }
        if(inChecks && t.includes('Ticks:')) break;
        if(inChecks){
          // Try common column pairs for label + result
          const candidates = [
            [(r[8]||'').trim(), (r[12]||'').trim()],
            [(r[7]||'').trim(), (r[11]||'').trim()],
            [(r[9]||'').trim(), (r[13]||'').trim()]
          ];
          for(const [left, val] of candidates){
            if(left && (val.includes('✅') || val.includes('❌') || /yes|no/i.test(val))){
              const tick = /✅|yes/i.test(val) ? '✅' : '❌';
              items.push(`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px">
                <span>${left}</span>
                <b>${tick} ${val.replace(/✅|❌/g,'').trim()}</b>
              </div>`);
              break;
            }
          }
        }
      }
      checks.innerHTML = items.length ? items.join('') : '<span style="color:var(--dim)">No checks found</span>';
    }

    if(rsi && rows){
      const rsiVal = (rows[67]?.[2] || findValue(rows,'RSI (14)') || '—').trim();
      const bbU = (rows[68]?.[2] || findValue(rows,'BB upper') || '—').trim();
      const bbM = (rows[69]?.[2] || findValue(rows,'BB mid') || '—').trim();
      const bbL = (rows[70]?.[2] || findValue(rows,'BB lower') || '—').trim();
      rsi.innerHTML = `
        <div class="crowd-row"><span>RSI (14)</span><b>${rsiVal}</b></div>
        <div class="crowd-row"><span>BB upper</span><b>${bbU}</b></div>
        <div class="crowd-row"><span>BB mid</span><b>${bbM}</b></div>
        <div class="crowd-row"><span>BB lower</span><b>${bbL}</b></div>
      `;
    }

    if(cot && rows){
      const smart = (findValue(rows,'Smart vs dumb money') || findValue(rows,'Aligned contrarian') || '—').replace(/🟢|🔴/g,'').trim();
      const cotScore = findValue(rows,'Pair COT score') || '—';
      const retail = findValue(rows,'Retail (crowd long %)') || '—';
      cot.innerHTML = `
        <div class="crowd-row"><span>Pair COT score</span><b>${cotScore}</b></div>
        <div class="crowd-row"><span>Retail long %</span><b>${retail}</b></div>
        <div style="margin-top:12px;font-size:13px;line-height:1.45;color:var(--muted)">${smart}</div>
      `;
    }
  }, 50);


  const ctx = document.getElementById('scoreChart');
  if(ctx){
    const parts = String(score).split('/');
    const passed = parseFloat(parts[0]) || 5;
    const total = parseFloat(parts[1]) || 14;
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Passed', 'Failed'],
        datasets: [{
          data: [passed, Math.max(0, total-passed)],
          backgroundColor: ['#22c55e','#ef4444'],
          borderWidth: 0,
          cutout: '68%'
        }]
      },
      options: {
        plugins: { legend: { display: true, position: 'bottom', labels: { color:'#93a0b8', boxWidth:12 } } },
        maintainAspectRatio: false
      }
    });
  }
}

document.getElementById('backBtn').onclick = showMenu;
window.addEventListener('popstate', ()=>{
  const h = location.hash.slice(1).toUpperCase();
  if([...FX, ...INDICES].includes(h)) showPair(h); else showMenu();
});
buildMenus();
const init = location.hash.slice(1).toUpperCase();
if([...FX, ...INDICES].includes(init)) showPair(init); else showMenu();
</script>
</body>
