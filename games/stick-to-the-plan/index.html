<style>
:root{
  --paper:#eef3f0; --grid:#dbe5df; --card:#ffffff; --ink:#17223b; --soft:#56627a; --line:#cad6cf;
  --pen:#2a4ea0; --pen-ink:#ffffff; --good:#1d7a57; --good-bg:#d8f0e4; --amber:#a76a00; --amber-bg:#fdf0cf;
  --bad:#b23b3b; --bad-bg:#f8dcdc; --shadow:0 1px 0 #cad6cf, 0 10px 24px -18px rgba(23,34,59,.5);
  --head:"Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, Tahoma, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101823; --grid:#18232f; --card:#172231; --ink:#e7edf4; --soft:#9fb0c4; --line:#2a3a4d;
  --pen:#86a8ff; --pen-ink:#0b1426; --good:#47c58f; --good-bg:#14352a; --amber:#f2b543; --amber-bg:#3a2d10;
  --bad:#f07474; --bad-bg:#3d1c1f; --shadow:0 1px 0 #2a3a4d, 0 12px 26px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#101823; --grid:#18232f; --card:#172231; --ink:#e7edf4; --soft:#9fb0c4; --line:#2a3a4d;
  --pen:#86a8ff; --pen-ink:#0b1426; --good:#47c58f; --good-bg:#14352a; --amber:#f2b543; --amber-bg:#3a2d10;
  --bad:#f07474; --bad-bg:#3d1c1f; --shadow:0 1px 0 #2a3a4d, 0 12px 26px -18px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font:400 19px/1.55 var(--body);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:3px}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0}
h1{font-size:clamp(44px,11vw,84px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(28px,6vw,38px);font-weight:800;letter-spacing:-.01em}
h3{font-size:22px;font-weight:600}
p{margin:.6em 0}
.muted{color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 22px;border-radius:12px;
  border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;font-size:19px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:active{transform:translateY(1px)}

/* start screen */
.hero{padding:28px 4px 8px}
.hero .ruled{border-top:3px solid var(--ink);margin:18px 0 0;padding-top:14px;font-size:21px;max-width:34em}
.three{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin:18px 0}
.chip{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--card)}
.chip b{display:block;font-family:var(--head);font-size:26px}
.chip.g b{color:var(--good)} .chip.m b{color:var(--pen)} .chip.l b{color:var(--bad)}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0 6px;font-size:16px}
.road div{padding:10px 12px;border:2px solid var(--ink);margin-left:-2px}
.road div:first-child{margin-left:0;border-radius:10px 0 0 10px}
.road div:last-child{border-radius:0 10px 10px 0;background:var(--ink);color:var(--paper)}
.road b{display:block;font-size:18px}
@media (max-width:520px){.three{grid-template-columns:1fr}.road{grid-template-columns:1fr}.road div{margin-left:0;margin-top:-2px;border-radius:0}
 .road div:first-child{border-radius:10px 10px 0 0}.road div:last-child{border-radius:0 0 10px 10px}}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 8px;margin:0 0 12px;border-bottom:2px solid var(--ink)}
.hudrow{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.hud .bal{font-family:var(--head);font-weight:800;font-size:30px}
.pill{font-size:15px;font-weight:700;border-radius:99px;padding:3px 12px;border:2px solid currentColor}
.pill.personal{color:var(--pen)} .pill.challenge{color:var(--amber)} .pill.funded{color:var(--good)}
.hud small{font-size:16px;color:var(--soft)}
.hud small b{color:var(--ink)}
.progress{display:flex;gap:4px;margin-top:8px}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress i.on{background:var(--good)} .progress i.half{background:var(--amber)} .progress i.off{background:var(--bad)} .progress i.now{background:var(--ink)}
.planbtn{margin-left:auto;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}

/* scenario */
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:16px;color:var(--soft);margin-bottom:6px}
.meta b{color:var(--ink)}
.chart{margin:14px 0 6px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.story{font-size:20px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{text-align:left;width:100%;min-height:60px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:19px;line-height:1.4}
.choice:hover{border-color:var(--ink)}
.choice .k{font-family:var(--head);font-weight:800;margin-right:8px;color:var(--pen)}
.hint{margin-top:12px;border-left:4px solid var(--pen);padding:8px 14px;background:color-mix(in srgb,var(--pen) 8%,transparent);border-radius:0 10px 10px 0;font-size:18px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--pen);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:44px}

/* result */
.result{position:relative;overflow:hidden}
.stamp{position:absolute;right:14px;top:14px;transform:rotate(-9deg);font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:.06em;
  border:4px solid currentColor;border-radius:8px;padding:4px 12px;opacity:.9;text-transform:uppercase}
@media (max-width:520px){.stamp{font-size:17px;border-width:3px;padding:3px 9px;right:10px;top:10px}.outcome{padding-right:96px}}
.stamp.on{color:var(--good)} .stamp.half{color:var(--amber)} .stamp.off{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thump .45s cubic-bezier(.2,1.6,.4,1) both}
 @keyframes thump{from{transform:rotate(-9deg) scale(2.2);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.9}}}
.outcome{font-family:var(--head);font-weight:800;font-size:clamp(34px,8vw,48px);margin:6px 0 2px;padding-right:130px}
.outcome.good{color:var(--good)} .outcome.bad{color:var(--bad)} .outcome.flat{color:var(--soft)}
.money{font-size:22px;font-weight:700}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.rtag{font-size:15px;font-weight:700;padding:3px 10px;border-radius:8px}
.rtag.ok{background:var(--good-bg);color:var(--good)} .rtag.bad{background:var(--bad-bg);color:var(--bad)}
.note{border-radius:10px;padding:10px 14px;margin-top:10px;font-size:18px}
.note.warn{background:var(--amber-bg)} .note.badn{background:var(--bad-bg)} .note.goodn{background:var(--good-bg)}

/* chance card */
.chance{border:3px solid var(--amber);background:var(--amber-bg)}
.chance .tag{display:inline-block;background:var(--amber);color:var(--card);font-weight:700;border-radius:8px;padding:2px 10px;font-size:16px}
:root[data-theme="dark"] .chance .tag{color:#1a1203}
.event{border:3px solid var(--ink)}

/* life strip */
.life{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:16px;color:var(--soft);margin-top:4px}
.life b{color:var(--ink)}

/* plan dialog */
dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--card);color:var(--ink);max-height:86vh}
dialog::backdrop{background:rgba(10,16,28,.55)}
.dhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--card)}
.dbody{padding:8px 18px 18px;overflow:auto}
.rule{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px;align-items:start}
.rule .id{font-family:var(--head);font-weight:800;color:var(--pen)}
.rule .st{font-size:15px;font-weight:700;white-space:nowrap}
.sec{font-family:var(--head);font-weight:600;font-size:18px;margin:14px 0 0;color:var(--soft)}

/* end */
.grade{font-family:var(--head);font-weight:800;font-size:clamp(90px,24vw,150px);line-height:.9}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
@media(min-width:620px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.kpi span{display:block;font-size:15px;color:var(--soft)}
.kpi b{font-family:var(--head);font-size:28px}
.kpi em{display:block;font-style:normal;font-size:14px;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:17px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right}
.meter{height:22px;border-radius:11px;background:var(--line);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--good);border-radius:11px}
.offer{border:3px solid var(--good);background:var(--good-bg)}
.offer .price{font-family:var(--head);font-weight:800;font-size:clamp(40px,10vw,56px);line-height:1}
.offer .was{text-decoration:line-through;color:var(--soft);font-size:20px;margin-left:8px}
.offer .btn{text-decoration:none;background:var(--good);border-color:var(--good);color:#fff}
.locked{border:2px dashed var(--line)}
.cta{background:var(--ink);color:var(--paper);border-radius:16px;padding:22px}
.cta a{color:var(--paper)}
.cta .btn{background:var(--paper);color:var(--ink);border-color:var(--paper);text-decoration:none}
.foot{font-size:14px;color:var(--soft);margin-top:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.scrollx{overflow-x:auto}
</style>
</head>

/* ======================= ENGINE ======================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function newState(deck){return{i:0,phase:"personal",personal:START,chR:0,fundR:0,feesPaid:0,refund:0,mult:1,buffer:BUFFER,extra:0,
 rTotal:0,curve:[0],trades:[],pts:{plan:0,cards:0,events:0},ok:{},bad:{},marks:[],deck:deck.slice(),queue:[],challenges:0,funded:false,fundLostOnce:false,months:0,fromAcct:0,log:[]}}

function mark(s,ok,bad){(ok||[]).forEach(r=>s.ok[r]=(s.ok[r]||0)+1);(bad||[]).forEach(r=>s.bad[r]=(s.bad[r]||0)+1)}
function rDollar(s){return s.phase==="personal"?s.personal*0.01:CH_R}

function playScenario(s,ci){
  const sc=SC[s.i], ch=sc.c[ci]; const out={sc,ch,notes:[]};
  let R=ch.r*s.mult, perR=rDollar(s), dollars=R*perR;
  if(s.mult>1&&ch.r!==0){out.notes.push(["warn",`Your size was ${s.mult}x because of last month's money pressure, so this result is ${s.mult}x too.`]);mark(s,[],["L2"])}
  if(s.mult>1&&ch.r===0) out.notes.push(["warn","No trade taken, so the extra size from last month's money pressure didn't bite this time."]);
  s.mult=1;
  if(s.phase==="personal") s.personal+=dollars;
  else if(s.phase==="challenge") s.chR+=R; else s.fundR+=R;
  out.R=R; out.dollars=dollars; out.perR=perR; out.phase=s.phase;
  if(!ch.none){s.trades.push(R)}
  s.rTotal+=R; s.curve.push(s.rTotal);
  s.pts.plan+= ch.k==="plan"?100: ch.k==="half"?40:0;
  s.marks.push(ch.k); mark(s,ch.ok,ch.bad);
  s.months++;
  // prop limits
  if(s.phase!=="personal"){
    const cum=s.phase==="challenge"?s.chR:s.fundR;
    if(R<=-DAILY||cum<=-MAXL){
      const which=R<=-DAILY?"the 4% daily loss limit":"the 8% max loss limit";
      if(s.phase==="challenge"){out.notes.push(["badn",`That breaches ${which}. Challenge failed and the $${FEE} fee is gone. You're back on your personal account.`]);s.phase="personal";s.chR=0}
      else{out.notes.push(["badn",`That breaches ${which}. The funded account is closed and its unpaid profit goes with it. You're back on your personal account.`]);s.phase="personal";s.fundR=0;s.funded=false;s.fundLostOnce=true}
      mark(s,[],["F1"]);
    } else if(s.phase==="challenge"&&s.chR>=CH_TARGET){
      s.queue.push({type:"pass"});
    } else if(R<0&&R>-DAILY){ mark(s,["F1"],[]) }
  }
  if(CARD_AFTER.includes(s.i)&&s.deck.length) s.queue.push({type:"card",card:s.deck.shift()});
  if(BUY_AFTER.includes(s.i)) s.queue.push({type:"buy"});
  s.i++;
  return out;
}
function applyFx(s,fx){
  const notes=[];
  if(fx.rent) s.extra+=fx.rent;
  if(fx.mult) s.mult=fx.mult;
  if(fx.buffer){let cost=-fx.buffer; if(s.buffer>=cost) s.buffer-=cost; else {const rest=cost-s.buffer; s.buffer=0; s.personal-=rest; s.fromAcct+=rest; notes.push(["badn",`The buffer ran dry, so $${fmt(rest)} came out of the trading account.`])}}
  if(fx.acct){s.personal+=fx.acct; s.fromAcct+=-fx.acct}
  return notes;
}
function playCard(s,card,ci){const ch=card.c[ci];s.pts.cards+=ch.k==="plan"?50:0;mark(s,ch.ok,ch.bad);return{ch,notes:applyFx(s,ch.fx)}}
function buyOptions(s){
  const profit=s.personal-START, can=profit>=FEE;
  if(s.phase!=="personal") return null;
  return can?[{x:`Buy the $50k challenge with $${FEE} of profit.`,k:"plan",buy:true,ok:["L3"],fb:"Bought from profits. Your personal capital is intact."},
             {x:"Not yet. Keep building on the personal account.",k:"half",buy:false,bad:["P3"],fb:"Careful is fine, but you've earned this step. The plan says go."}]
            :[{x:"Not yet. Profits don't cover the fee, so keep building.",k:"plan",buy:false,ok:["L3"],fb:"Exactly right. When profits cover the fee, you'll buy it with house money."},
              {x:`Buy it anyway using account capital ($${FEE}).`,k:"break",buy:true,bad:["L3"],fb:"Bought with capital you can't afford to lose. The fee is now a hole to climb out of."}];
}
function playBuy(s,o){s.pts.events+=o.k==="plan"?50:o.k==="half"?20:0;mark(s,o.ok,o.bad);
  if(o.buy){s.personal-=FEE;s.feesPaid+=FEE;s.phase="challenge";s.chR=0;s.challenges++}}
function playPass(s){s.passed=true;s.phase="funded";s.fundR=0;s.funded=true;if(!s.refund)s.refund=FEE}
function payout(s){return(s.phase==="funded"&&s.fundR>0)?s.fundR*CH_R*SPLIT+(s.refund||0):0}

function nextStep(s){if(s.queue.length){const q=s.queue.shift(); if(q.type==="buy"&&s.phase!=="personal") return nextStep(s); return q} return s.i<SC.length?{type:"sc"}:{type:"end"}}

function simulatePlan(deck){
  const s=newState(deck);
  for(let guard=0;guard<60;guard++){
    const st=nextStep(s);
    if(st.type==="end") break;
    if(st.type==="sc"){playScenario(s,SC[s.i].c.findIndex(c=>c.k==="plan"))}
    else if(st.type==="card"){playCard(s,st.card,st.card.c.findIndex(c=>c.k==="plan"))}
    else if(st.type==="buy"){const o=buyOptions(s).find(o=>o.k==="plan");playBuy(s,o)}
    else if(st.type==="pass"){playPass(s)}
  }
  return s;
}

function stats(s){
  const t=s.trades, wins=t.filter(x=>x>0), losses=t.filter(x=>x<0);
  const mean=t.length?t.reduce((a,b)=>a+b,0)/t.length:0;
  const sd=t.length>1?Math.sqrt(t.reduce((a,b)=>a+(b-mean)**2,0)/(t.length-1)):0;
  const dsd=losses.length?Math.sqrt(losses.reduce((a,b)=>a+b*b,0)/t.length):0;
  let peak=0,dd=0; s.curve.forEach(v=>{peak=Math.max(peak,v);dd=Math.min(dd,v-peak)});
  const pay=payout(s), pnl=(s.personal-START)+pay;
  const decisions=s.marks.length, onPlan=s.marks.filter(m=>m==="plan").length;
  const netPts=Math.round(s.rTotal*10), ddBonus=dd>=-3?100:dd>=-5?50:0;
  const score=s.pts.plan+s.pts.cards+s.pts.events+netPts+ddBonus;
  return{n:t.length,winRate:t.length?wins.length/t.length:0,avgW:wins.length?wins.reduce((a,b)=>a+b,0)/wins.length:0,
   avgL:losses.length?losses.reduce((a,b)=>a+b,0)/losses.length:0,exp:mean,pf:losses.length?wins.reduce((a,b)=>a+b,0)/Math.abs(losses.reduce((a,b)=>a+b,0)):Infinity,
   sharpe:sd?mean/sd:0,sortino:dsd?mean/dsd:0,dd,pay,pnl,ret:pnl/START,adherence:decisions?onPlan/decisions:0,score,netPts,ddBonus}
}
function grade(sc){return sc>=1300?"A+":sc>=1150?"A":sc>=950?"B":sc>=750?"C":sc>=500?"D":"F"}

const fmt=(n,d=0)=>Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>(n<0?"-$":"$")+fmt(n,0);
const sMoney=n=>(n>0?"+$":n<0?"-$":"$")+fmt(n,0);
const sR=r=>(r>0?"+":r<0?"-":"")+fmt(r,1)+"R";
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chartSVG(sc){
  const c=sc.chart, r=rng(c.seed), N=28, W=520,H=290, padL=8,padR=132,padT=18,padB=24;
  const segs=c.pts.length-1, closes=[];
  const span=Math.max(...c.pts)-Math.min(...c.pts);
  for(let k=0;k<N;k++){const p=k/(N-1)*segs,i=Math.min(Math.floor(p),segs-1),f=p-i;
    let v=c.pts[i]+(c.pts[i+1]-c.pts[i])*f; if(k<N-1) v+=(r()-.5)*span*.10; closes.push(v)}
  closes[N-1]=c.pts[c.pts.length-1];
  const cs=closes.map((cl,k)=>{const o=k?closes[k-1]:cl-(r()-.5)*span*.05;const hi=Math.max(o,cl)+r()*span*.05,lo=Math.min(o,cl)-r()*span*.05;return{o,c:cl,h:hi,l:lo}});
  let lo=Math.min(...cs.map(x=>x.l),...c.lines.map(l=>l[0])),hi=Math.max(...cs.map(x=>x.h),...c.lines.map(l=>l[0]));
  const pad=(hi-lo)*.06; lo-=pad; hi+=pad;
  const y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB), cw=(W-padL-padR)/N;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sc.sym)} chart with ${c.lines.map(l=>l[1]).join(", ")}">`;
  g+=`<rect x="0" y="0" width="${W}" height="${H}" rx="10" fill="var(--card)" stroke="var(--line)"/>`;
  const col={lvl:"var(--soft)",pen:"var(--pen)",bad:"var(--bad)",good:"var(--good)"};
  const lab=c.lines.map(([v,t,k])=>({v,t,k,yy:y(v),ly:y(v)+6})).sort((a,b)=>a.ly-b.ly);
  for(let i=1;i<lab.length;i++) if(lab[i].ly-lab[i-1].ly<19) lab[i].ly=lab[i-1].ly+19;
  const over=lab.length?Math.max(0,lab[lab.length-1].ly-(H-padB+4)):0; lab.forEach(l=>l.ly-=over);
  lab.forEach(({t,k,yy,ly})=>{g+=`<line x1="${padL}" x2="${W-padR+6}" y1="${yy}" y2="${yy}" stroke="${col[k]}" stroke-width="2.2" stroke-dasharray="${k==="lvl"?"2 5":"8 5"}"/>`+
    `<text x="${W-padR+12}" y="${ly}" font-size="17" font-family="Atkinson Hyperlegible, Verdana, sans-serif" font-weight="700" fill="${col[k]}">${esc(t)}</text>`});
  cs.forEach((k,i)=>{const x=padL+i*cw+cw/2, up=k.c>=k.o, cl=up?"var(--good)":"var(--bad)";
    g+=`<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${cl}" stroke-width="1.6"/>`+
       `<rect x="${x-cw*.32}" y="${Math.min(y(k.o),y(k.c))}" width="${cw*.64}" height="${Math.max(1.5,Math.abs(y(k.o)-y(k.c)))}" fill="${cl}" rx="1"/>`});
  if(c.vline){const x=padL+(N-1)*cw+cw*.9;g+=`<line x1="${x}" x2="${x}" y1="${padT}" y2="${H-padB}" stroke="var(--amber)" stroke-width="3"/><text x="${x-6}" y="${padT+16}" text-anchor="end" font-size="17" font-weight="700" font-family="Atkinson Hyperlegible, Verdana, sans-serif" fill="var(--amber)">${esc(c.vline)}</text>`}
  g+=`<text x="${padL+8}" y="${H-6}" font-size="15" fill="var(--soft)" font-family="Atkinson Hyperlegible, Verdana, sans-serif">${esc(sc.sym)} 15m, illustrative</text>`;
  return g+"</svg>";
}

  const s=S, bal=s.phase==="personal"?s.personal:s.phase==="challenge"?CH_SIZE+s.chR*CH_R:CH_SIZE+s.fundR*CH_R;
  const label={personal:"Personal account",challenge:"$50k challenge",funded:"$50k funded"}[s.phase];
  let extra="";
  if(s.phase==="challenge") extra=`<small>Target <b>${fmt(Math.max(0,CH_TARGET-s.chR),1)}%</b> to go · room to max loss <b>${fmt(MAXL+s.chR,1)}%</b></small>`;
  if(s.phase==="funded") extra=`<small>Payout so far <b>${money(Math.max(0,s.fundR*CH_R*SPLIT))}</b></small>`;
  if(s.phase==="personal"&&s.i>0) extra=`<small>Personal P&amp;L <b>${sMoney(s.personal-START)}</b></small>`;
  const prog=SC.map((_,k)=>{const m=s.marks[k];return`<i class="${m==="plan"?"on":m==="half"?"half":m==="break"?"off":k===s.i?"now":""}"></i>`}).join("");
  const okN=Object.values(s.ok).reduce((a,b)=>a+b,0), badN=Object.values(s.bad).reduce((a,b)=>a+b,0);
  return`<div class="hud" role="status" aria-live="polite"><div class="hudrow"><span class="pill ${s.phase}">${label}</span><span class="bal">${money(bal)}</span>
   <button class="planbtn" onclick="openPlan()">The plan ✓${okN} ✗${badN}</button></div>
   <div class="hudrow" style="margin-top:4px"><small>Trades done <b>${s.marks.length}/10</b></small><small>Total <b>${sR(s.rTotal)}</b></small>${extra}</div>
   <div class="life"><span>Rent <b>$${fmt(RENT+s.extra)}</b>/mo, paid by salary</span><span>Buffer <b>$${fmt(s.buffer)}</b></span>${s.mult>1?`<span style="color:var(--bad)"><b>Next trade at ${s.mult}x size</b></span>`:""}</div>
   <div class="progress" aria-hidden="true">${prog}</div></div>`;
}

function openPlan(){
  let h="",last="";
  RULES.forEach(([sec,id,txt])=>{if(sec!==last){h+=`<div class="sec">${sec}</div>`;last=sec}
    const o=S?S.ok[id]||0:0,b=S?S.bad[id]||0:0;
    h+=`<div class="rule"><span class="id">${id}</span><span>${esc(txt)}</span><span class="st">${o?`<span style="color:var(--good)">✓${o}</span> `:""}${b?`<span style="color:var(--bad)">✗${b}</span>`:""}${!o&&!b?'<span class="muted">–</span>':""}</span></div>`});
  document.getElementById("planBody").innerHTML=`<p class="muted" style="font-size:16px">Ticks show each time you followed a rule; crosses show each time you broke one.</p>`+h;
  planDlg.showModal();
}

function begin(){
  const seed=Math.floor(Math.random()*1e9); DECKORDER=shuffle(DECK,rng(seed)).slice(0,3);
  S=newState(DECKORDER); PLAN=simulatePlan(DECKORDER);
  try{S.attempt=(parseInt(localStorage.getItem("stp_plays")||"0",10)||0)+1;localStorage.setItem("stp_plays",String(S.attempt))}catch(e){S.attempt=1}
  step();
}

let CUR=null;
const CARDHINT="Rules L1 and L2: bills come from salary and the buffer, and life pressure never changes position size.";
function showHint(el,txt){const d=document.createElement("div");d.className="hint";d.textContent=txt;el.replaceWith(d)}
function step(){
  CUR=nextStep(S); window.scrollTo({top:0});
  if(CUR.type==="sc") return showScenario();
  if(CUR.type==="card") return showCard();
  if(CUR.type==="buy") return showBuy();
  if(CUR.type==="pass") return showPass();
  return showEnd();
}

function showScenario(){
  const sc=SC[S.i], order=shuffle(sc.c.map((c,k)=>k),rng(sc.chart.seed*7+S.i));
  const risk=rDollar(S)*S.mult;
  app.innerHTML=hud()+`<article class="card">
   <div class="meta"><span><b>${esc(sc.sym)}</b></span><span>${esc(sc.when)}</span><span>1R = <b>$${fmt(risk)}</b>${S.mult>1?" (inflated)":""}</span></div>
   <h2>${esc(sc.t)}</h2>
   <div class="chart">${chartSVG(sc)}</div>
   <p class="story">${esc(sc.story)}</p>
   <div class="choices">${order.map((k,j)=>`<button class="choice" onclick="choose(${k})"><span class="k">${"ABCD"[j]}</span>${esc(sc.c[k].x)}</button>`).join("")}</div>
   <button class="linkbtn" onclick="showHint(this,SC[S.i].hint)">Check the plan</button>
  </article>`;
}

function choose(k){
  const out=playScenario(S,k), ch=out.ch, R=out.R;
  const cls=ch.k==="plan"?"on":ch.k==="half"?"half":"off", st=ch.k==="plan"?"On plan":ch.k==="half"?"Half plan":"Off plan";
  const label=ch.none?"No trade":R>=2?"Large win":R>=1.5?"Medium win":R>0?"Small win":R===0?"Flat":R>=-1?"Small loss":"Heavy loss";
  const oc=R>0?"good":R<0?"bad":"flat";
  const tags=(ch.ok||[]).map(r=>`<span class="rtag ok">✓ ${r}</span>`).join("")+(ch.bad||[]).map(r=>`<span class="rtag bad">✗ ${r}</span>`).join("");
  let extra="";
  if(ch.k==="break"&&R>0) extra=`<div class="note warn">You made money, but by breaking the plan. That's luck you'll try to repeat, and luck runs out.</div>`;
  if(ch.k==="plan"&&R<0) extra=`<div class="note goodn">A loss, taken exactly as planned. Small losses are how you stay in the game for the large wins.</div>`;
  const planCh=out.sc.c.find(c=>c.k==="plan");
  const cmp=ch.k!=="plan"?`<p class="muted" style="font-size:17px">The plan's choice: ${esc(planCh.x)} Result ${sR(planCh.r)}.</p>`:"";
  app.innerHTML=hud()+`<article class="card result">
   <span class="stamp ${cls}">${st}</span>
   <div class="meta"><span><b>${esc(out.sc.sym)}</b></span><span>${esc(out.sc.t)}</span></div>
   <div class="outcome ${oc}">${label}</div>
   <div class="money">${sR(R)} · ${sMoney(out.dollars)}</div>
   <p>${esc(ch.fb)}</p>
   <div class="rules">${tags}</div>
   ${extra}${out.notes.map(n=>`<div class="note ${n[0]}">${esc(n[1])}</div>`).join("")}
   ${cmp}
   <div class="row"><button class="btn" onclick="step()">Continue</button></div>
  </article>`;
}

function showCard(){
  const card=CUR.card;
  app.innerHTML=hud()+`<article class="card chance">
   <span class="tag">Chance card</span>
   <h2 style="margin-top:10px">${esc(card.t)}</h2>
   <p class="story">${esc(card.d)}</p>
   <div class="choices">${card.c.map((c,k)=>`<button class="choice" onclick="pickCard(${k})"><span class="k">${"ABC"[k]}</span>${esc(c.x)}</button>`).join("")}</div>
   <button class="linkbtn" onclick="showHint(this,CARDHINT)">Check the plan</button>
  </article>`;
}
function pickCard(k){
  const card=CUR.card,res=playCard(S,card,k),ch=res.ch,good=ch.k==="plan";
  app.innerHTML=hud()+`<article class="card chance result"><span class="stamp ${good?"on":"off"}">${good?"On plan":"Off plan"}</span>
   <span class="tag">Chance card</span><h2 style="margin-top:10px;padding-right:130px">${esc(card.t)}</h2>
   <p>${esc(ch.fb)}</p><div class="rules">${(ch.ok||[]).map(r=>`<span class="rtag ok">✓ ${r}</span>`).join("")}${(ch.bad||[]).map(r=>`<span class="rtag bad">✗ ${r}</span>`).join("")}</div>
   ${res.notes.map(n=>`<div class="note ${n[0]}">${esc(n[1])}</div>`).join("")}
   <div class="row"><button class="btn" onclick="step()">Continue</button></div></article>`;
}

let BUYOPTS=null;
function showBuy(){
  BUYOPTS=buyOptions(S); const profit=S.personal-START;
  app.innerHTML=hud()+`<article class="card event">
   <h2>Ready for a prop challenge?</h2>
   <p class="story">A $50,000 challenge costs $${FEE}. Pass it (+5% with no more than 4% lost in a day or 8% overall) and you trade the firm's money for an 80% split, with the fee refunded on your first payout.</p>
   <p>Your personal profit so far: <b>${sMoney(profit)}</b>. Rule L3 says the fee comes from profits only.</p>
   <div class="choices">${BUYOPTS.map((o,k)=>`<button class="choice" onclick="pickBuy(${k})"><span class="k">${"AB"[k]}</span>${esc(o.x)}</button>`).join("")}</div>
  </article>`;
}
function pickBuy(k){
  const o=BUYOPTS[k]; playBuy(S,o); const good=o.k==="plan";
  app.innerHTML=hud()+`<article class="card event result"><span class="stamp ${good?"on":o.k==="half"?"half":"off"}">${good?"On plan":o.k==="half"?"Half plan":"Off plan"}</span>
   <h2 style="padding-right:130px">${o.buy?"Challenge bought":"Staying personal"}</h2><p>${esc(o.fb)}</p>
   ${o.buy?`<p>From the next trade, 1R is <b>$500</b> (1% of $50,000). You need <b>+5R</b> to pass.</p>`:""}
   <div class="row"><button class="btn" onclick="step()">Continue</button></div></article>`;
}
function showPass(){
  playPass(S);
  app.innerHTML=hud()+`<article class="card event result"><span class="stamp on">Passed</span>
   <h2 style="padding-right:130px">Challenge passed</h2>
   <p class="story">You hit the 5% target without going near the loss limits. Same 1% risk, same rules, all the way through.</p>
   <p>You're now trading a <b>$50,000 funded account</b>. You keep 80% of the profit, and the $${FEE} fee comes back with your first payout.</p>
   <div class="row"><button class="btn" onclick="step()">Start funded trading</button></div></article>`;
}

function curveSVG(a,b){
  const W=520,H=250,p=40,all=[...a,...b],lo=Math.min(0,...all),hi=Math.max(1,...all),n=Math.max(a.length,b.length)-1;
  const x=i=>p+i/n*(W-p-12), y=v=>34+(hi-v)/(hi-lo)*(H-70);
  const path=c=>c.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join("");
  const F='font-family="Atkinson Hyperlegible, Verdana, sans-serif"';
  const ya=y(a[a.length-1]), yb=y(b[b.length-1]);
  let lb=yb-12, la=ya+24; if(Math.abs(la-lb)<20){lb=Math.min(ya,yb)-12; la=lb+20}
  lb=Math.max(18,lb);
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative R: your path ${sR(a[a.length-1])}, plan path ${sR(b[b.length-1])}">
   <line x1="${p}" x2="${W-12}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="2"/>
   <text x="2" y="${y(0)+6}" font-size="16" fill="var(--soft)" ${F}>0R</text>
   <path d="${path(b)}" fill="none" stroke="var(--good)" stroke-width="4" stroke-dasharray="10 6"/>
   <path d="${path(a)}" fill="none" stroke="var(--pen)" stroke-width="4"/>
   <text x="${W-12}" y="${lb}" text-anchor="end" font-size="17" font-weight="700" fill="var(--good)" ${F}>Plan ${sR(b[b.length-1])}</text>
   <text x="${W-12}" y="${la}" text-anchor="end" font-size="17" font-weight="700" fill="var(--pen)" ${F}>You ${sR(a[a.length-1])}</text>
   <text x="${p}" y="${H-6}" font-size="15" fill="var(--soft)" ${F}>Trade 1 to 10</text></svg>`;
}

const OFFER={first:{price:450,link:"https://paypal.me/quasidb/450USD"},retake:{price:500,link:"https://paypal.me/quasidb/500USD"},std:{price:600,link:"https://paypal.me/quasidb/600USD"}};
function lifetimeOffer(){
  const what="the Trading Plan spreadsheet, the knowledge pool, and the QDB indicators and EAs";
  if(S.passed){
    const first=(S.attempt||1)===1, cfg=first?OFFER.first:OFFER.retake;
    return `<div class="card offer" style="margin-top:14px"><h2>Lifetime access unlocked</h2>
     <p>You passed the prop challenge${first?" on your first try":""}. That earns discounted Lifetime access to ${what}.</p>
     <p><span class="price">$${cfg.price}</span><span class="was">$${OFFER.std.price}</span></p>
     ${first?"":`<p class="muted" style="font-size:17px">Passing on your first play unlocks the best price of $${OFFER.first.price}.</p>`}
     <div class="row"><a class="btn" href="${cfg.link}" target="_blank" rel="noopener">Pay $${cfg.price} USD with PayPal</a></div>
     <p style="font-size:17px;margin-top:12px">Add your Discord or Telegram username in the PayPal note so you can be given access.</p></div>`;
  }
  return `<div class="card locked" style="margin-top:14px"><h3>Discounted Lifetime access is locked</h3>
   <p style="margin-bottom:0">Pass the prop challenge to unlock it: $${OFFER.first.price} on your first play, $${OFFER.retake.price} on a replay (normally $${OFFER.std.price}). Following the plan is how you pass.</p></div>`;
}

function showEnd(){
  const u=stats(S), pl=stats(PLAN), g=grade(u.score);
  try{const best=JSON.parse(localStorage.getItem("stp_best")||"null"); if(!best||u.score>best.s) localStorage.setItem("stp_best",JSON.stringify({s:u.score,g}))}catch(e){}
  const rent=RENT+S.extra, cover=Math.min(1,u.pay/rent);
  const phaseEnd={personal:"Personal account",challenge:"Still on the challenge",funded:"Funded"}[S.phase];
  const k=(lab,val,sub)=>`<div class="kpi"><span>${lab}</span><b>${val}</b>${sub?`<em>${sub}</em>`:""}</div>`;
  const msg=u.adherence>=.95?"You followed the plan almost to the letter, and the numbers show what that does: small losses, big winners, and a funded account paying toward the rent."
    :u.adherence>=.7?"Mostly on plan. Look at the dashed line: every off-plan decision is the gap between you and it."
    :"The plan path made "+sR(PLAN.rTotal)+" with the same markets and the same bad luck. The difference was every rule you broke.";
  app.innerHTML=`<section class="hero" style="padding-top:8px">
   <p class="muted" style="margin:0">Your year, graded</p>
   <div class="grade">${g}</div>
   <p style="font-size:22px;margin-top:4px"><b>${u.score}</b> points · plan path scored ${pl.score}</p>
   <p class="ruled">${esc(msg)}</p></section>
   <div class="kpis">
    ${k("Journey P&L",sMoney(u.pnl),`${(u.ret*100).toFixed(1)}% on $7,500 · plan: ${sMoney(pl.pnl)}`)}
    ${k("Plan adherence",Math.round(u.adherence*100)+"%",`${S.marks.filter(m=>m==="plan").length} of ${S.marks.length} trades on plan`)}
    ${k("Total R",sR(S.rTotal),`plan: ${sR(PLAN.rTotal)}`)}
    ${k("Win rate",u.n?Math.round(u.winRate*100)+"%":"–",`${u.n} trades taken`)}
    ${k("Expectancy",u.n?sR(u.exp):"–","per trade")}
    ${k("Profit factor",u.pf===Infinity?"∞":u.pf.toFixed(2),"above 1.5 is strong")}
    ${k("Max drawdown",sR(u.dd),`plan: ${sR(pl.dd)}`)}
    ${k("Trade Sharpe",u.n>1?u.sharpe.toFixed(2):"–","mean R ÷ st.dev of R")}
    ${k("Sortino",u.n>1&&u.sortino?u.sortino.toFixed(2):"–","only punishes losses")}
    ${k("Funded payout",money(u.pay),`plan: ${money(pl.pay)}`)}
   </div>
   <div class="card"><h3>You vs the plan</h3><div class="chart">${curveSVG(S.curve,PLAN.curve)}</div>
    <p class="muted" style="font-size:16px">Solid line is your path, dashed is the plan path, both through the same chance cards.</p></div>
   <div class="card" style="margin-top:14px"><h3>Where the money ended up</h3><div class="scrollx"><table>
    <tr><td>Personal account</td><td class="n">${money(S.personal)}</td></tr>
    <tr><td>Challenge fees paid</td><td class="n">${S.feesPaid?"-"+money(S.feesPaid):"$0"}</td></tr>
    <tr><td>Bills taken from the trading account</td><td class="n">${S.fromAcct?"-"+money(S.fromAcct):"$0"}</td></tr>
    <tr><td>Funded payout (80% + fee refund)</td><td class="n">${money(u.pay)}</td></tr>
    <tr><td>Savings buffer left</td><td class="n">${money(S.buffer)}</td></tr>
    <tr><td>Status at year end</td><td class="n">${phaseEnd}</td></tr></table></div>
    <h3 style="margin-top:16px">Rent covered by trading</h3>
    <div class="meter" role="img" aria-label="${Math.round(cover*100)} percent"><i style="width:${(cover*100).toFixed(0)}%"></i></div>
    <p style="margin:0">${u.pay>0?`Your first payout of ${money(u.pay)} covers <b>${Math.round(u.pay/rent*100)}%</b> of a month's $${fmt(rent)} rent. That's the plan working on someone else's capital.`:`No payout this year. The plan path's payout was ${money(pl.pay)}.`}</p></div>
   <div class="card" style="margin-top:14px"><h3>How the score adds up</h3><table>
    <tr><td>Trade decisions (100 on plan, 40 half)</td><td class="n">${S.pts.plan}</td></tr>
    <tr><td>Chance cards (50 each on plan)</td><td class="n">${S.pts.cards}</td></tr>
    <tr><td>Challenge decisions</td><td class="n">${S.pts.events}</td></tr>
    <tr><td>Net R × 10</td><td class="n">${u.netPts}</td></tr>
    <tr><td>Drawdown bonus (≤3R: 100, ≤5R: 50)</td><td class="n">${u.ddBonus}</td></tr></table></div>
   ${lifetimeOffer()}
   <div class="cta" style="margin-top:18px"><h2>Trade with people who stick to the plan</h2>
    <p>The QDB community has been through every one of these moments: the NFP whipsaw, the revenge itch, the challenge you nearly rushed. Members get the plan, the spreadsheet, the indicators and EAs, and a room full of traders who'll talk you out of the 3% trade. You can also follow along on YouTube.</p>
    <div class="row"><a class="btn" href="https://www.patreon.com/quasidb" target="_blank" rel="noopener">Join on Patreon</a><a class="btn" href="https://www.youtube.com/@quasidb" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff0033" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z"/><path fill="#fff" d="M9.6 15.6V8.4l6.3 3.6z"/></svg>Watch on YouTube</a><button class="btn" style="background:transparent;color:var(--paper)" onclick="startScreen()">Play again</button></div></div>
   <p class="foot">Educational only, not financial advice. Scenarios, prices and outcomes are illustrative and curated to teach the rules; real win rates for a 2:1+ plan usually run 40–55%, and past or simulated results don't guarantee future ones. Prop firm rules, fees and splits vary; check your firm's terms. Trade Sharpe here is per trade, not annualised.</p>`;
}

startScreen();
</script>
<script src="../qdb-games.js" data-game="stick-to-the-plan" data-title="Stick to the Plan"></script>
<script>

  var _end = showEnd;

    _end();
    var u = stats(S), g = grade(u.score);
    QDBGames.mount(app, {text: 'I graded ' + g + ' (' + u.score + ' points) on Stick to the Plan: ten trades, one year, real bills. Can you beat me by sticking to the plan?'});
