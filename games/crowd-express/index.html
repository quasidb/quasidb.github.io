<style>
:root{
  --bg:#0b0f17; --bg2:#101624; --panel:#141b2b; --line:#26324a; --text:#e8edf6; --muted:#a3afc5; --dim:#6b7892;
  --buy:#22c55e; --buy-bg:rgba(34,197,94,.13); --sell:#ef4444; --sell-bg:rgba(239,68,68,.13);
  --accent:#f5b83d; --amber:#ffb000; --blue:#3b82f6; --rail:#55617a;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Space Grotesk',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;text-decoration:none;color:var(--text)}
.brand img{width:30px;height:30px;border-radius:50%}
.hud{display:flex;gap:8px;font-family:var(--mono);font-size:14px}
.hud span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;white-space:nowrap}
.hud b{color:var(--accent)}

main{padding:22px 0 10px}
h1{font-size:clamp(38px,7vw,62px);line-height:1.04;letter-spacing:-.035em;font-weight:700}
h1 em{font-style:normal;color:var(--amber)}
h2{font-size:clamp(26px,4.4vw,36px);line-height:1.12;letter-spacing:-.02em}
h3{font-size:20px;letter-spacing:-.01em}
.lead{font-size:20px;color:var(--muted);margin:14px 0 0;max-width:42em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:18px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1205}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* departure board */
.board{background:#090b0f;border:2px solid #2a2f3a;border-radius:12px;padding:12px 14px;font-family:var(--mono);color:var(--amber);
  box-shadow:inset 0 0 0 1px #000,inset 0 0 30px rgba(255,176,0,.06)}
.board .r{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:3px 0;border-bottom:1px dashed #2a2f3a;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.board .r:last-child{border-bottom:0}
.board .r span:first-child{color:#8a6a1e}
.board .r b{font-weight:700;text-shadow:0 0 6px rgba(255,176,0,.45)}
.board .big{font-size:22px}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

/* track */
.trackbox{margin:14px 0 6px;background:linear-gradient(180deg,#0f1626,#0b111d);border:1px solid var(--line);border-radius:16px;padding:6px 4px 2px;overflow:hidden}
.trackbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);padding:2px 10px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* price */
.price{margin-top:12px}
.price svg{display:block;width:100%;height:auto}
.pricehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-bottom:6px}
.pricehead b{color:var(--text)}

.story{font-size:19px;margin:16px 0 0}
.story b{color:var(--text)}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{text-align:left;width:100%;min-height:58px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:18px;line-height:1.4;display:grid;grid-template-columns:30px 1fr;gap:10px}
.choice:hover{border-color:var(--accent);background:#151d30}
.choice .k{font-family:var(--mono);font-weight:700;color:var(--accent)}
.choice small{display:block;color:var(--muted);font-size:15px;margin-top:2px}

/* result */
.result{position:relative}
.stamp{display:inline-block;font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border:2px solid currentColor;border-radius:8px;padding:4px 10px;margin-bottom:10px}
.stamp.best{color:var(--buy)} .stamp.ok{color:var(--accent)} .stamp.bad{color:var(--sell)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thump .4s cubic-bezier(.2,1.6,.4,1) both}@keyframes thump{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}}
.rline{font-family:var(--mono);font-size:20px;font-weight:700;margin:2px 0 8px}
.rline.g{color:var(--buy)} .rline.r{color:var(--sell)} .rline.n{color:var(--muted)}
.note{margin-top:14px;border-left:4px solid var(--amber);background:rgba(255,176,0,.07);border-radius:0 12px 12px 0;padding:12px 16px}
.note h4{font-family:var(--mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.note p{margin:0}

/* intro rules */
.rules{display:grid;gap:10px;margin-top:18px}
.rule{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rule .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,176,0,.1);color:var(--amber);font-family:var(--mono);font-weight:700;font-size:18px}
.rule b{display:block;font-size:18px}
.rule span{color:var(--muted);font-size:17px}

/* end */
.grade{font-family:var(--mono);font-weight:700;font-size:clamp(64px,16vw,110px);line-height:1;color:var(--amber);text-shadow:0 0 18px rgba(255,176,0,.35)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{display:block;font-size:14px;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:26px}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.tag{font-family:var(--mono);font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.tag.best{background:var(--buy-bg);color:var(--buy)} .tag.ok{background:rgba(245,184,61,.12);color:var(--accent)} .tag.bad{background:var(--sell-bg);color:var(--sell)}
.cta{margin-top:18px;background:linear-gradient(135deg,rgba(34,197,94,.10),rgba(59,130,246,.10));border:1px solid rgba(34,197,94,.35);border-radius:18px;padding:22px}
.cta p{color:var(--muted)}
.foot{font-size:14px;color:var(--dim);margin:22px 0 0}
.hidden{display:none!important}
</style>
</head>

<script>
/* ======================= THE LINE ======================= */
const STATIONS=[
  [0,"Edinburgh","Edinburgh Waverley"],[10,"Berwick","Berwick-upon-Tweed"],[20,"Newcastle","Newcastle"],[30,"Durham","Durham"],
  [40,"Darlington","Darlington"],[50,"York","York"],[60,"Doncaster","Doncaster"],[70,"Newark","Newark North Gate"],
  [80,"Peterborough","Peterborough"],[90,"Stevenage","Stevenage"],[100,"King's Cross","London King's Cross"]];
const stationAt=p=>STATIONS.reduce((a,s)=>Math.abs(s[0]-p)<Math.abs(a[0]-p)?s:a);

/* ======================= JOURNEYS =======================
   trail: retail % long readings, oldest first; the last one is "now".
   next: readings after you decide.  price: y values 0–100 (illustrative), zone [lo,hi,label,kind].
   choice kind: best (100 pts), ok (40), bad (0). r = result in R. */
const J=[
{id:"depot",pair:"GBPUSD",title:"Leaving the depot",
 trail:[18,22,27,33],next:[41,50,58],
 price:{pts:[70,74,72,66,60,62,58,52,55,60,63,65],after:[60,54,48,42,37,32],zone:[61,70,"Daily supply","supply"]},
 story:"The GBPUSD crowd has been buying every dip: <b>18% long a week ago, 33% now</b>, and still climbing. Price just rallied back into daily supply and printed a bearish rejection candle. The train left Edinburgh not long ago and there's a lot of track ahead.",
 c:[{x:"Sell at the daily supply rejection",s:"Board southbound early, against the crowd's bets",k:"best",r:2.5,
     fb:"Price rolled over from supply and the crowd kept buying all the way down, from 33% to 58% long. Every dip they bought became fuel for the move. You rode the train most of the way to York."},
    {x:"Buy the dip with everyone else",s:"Hop on with the passengers",k:"bad",r:-1,
     fb:"You bought into daily supply alongside the crowd. Price fell from the zone and you were one of the passengers stopped off at the next station."},
    {x:"Wait on the platform",s:"Let this one go",k:"ok",r:0,
     fb:"Nothing lost, but this was the textbook boarding point: early in the journey, at a strong level, against the crowd."}],
 lesson:"Early in the journey there's plenty of track ahead. Board at a strong station, going the opposite way to the crowd's bets."},

{id:"between",pair:"AUDUSD",title:"Between stations",
 trail:[44,49,54,58],next:[60,63,67],
 price:{pts:[80,76,72,68,64,60,62,58,55,57,54,52],after:[56,60,64,58,50,43,37],zone:[61,68,"Daily supply","supply"]},
 story:"The AUDUSD crowd is getting longer, <b>44% to 58% long</b>, as price slides. The direction says sell. But price is in the middle of nowhere: the nearest strong level is daily supply, about 40 pips above.",
 c:[{x:"Sell now at market",s:"Jump aboard between stations",k:"bad",r:-1,
     fb:"Right direction, wrong platform. Price bounced 40 pips into supply, took out your stop on the way, and then fell exactly as you expected. You were stopped off before the train left."},
    {x:"Set an alert and sell at the daily supply retest",s:"Wait for the train at the next strong station",k:"best",r:2.2,
     fb:"Price came up into supply, cleared the early sellers' stops, and turned. You sold the zone with your stop above it and rode the move down."},
    {x:"Buy: the crowd might be right this time",s:"Ride with the passengers",k:"bad",r:-1,
     fb:"The pop higher felt like confirmation, right up until supply held and price fell through your entry."}],
 lesson:"You can be right about the direction and still get stopped off. Board at a station: a weekly or daily supply or demand level."},

{id:"probe",pair:"USDJPY",title:"Passengers stopped off",
 trail:[52,45,38,31],next:[27,24,22],
 price:{pts:[20,26,32,38,44,50,46,42,40,44,47,43],after:[39,35,33,40,48,56,63,69],zone:[30,37,"Daily demand","demand"],stopline:[40,"Obvious swing low"]},
 story:"Price keeps rising and the USDJPY crowd keeps shorting it: <b>52% long down to 31%</b>, heading north towards Edinburgh. Price is pulling back. Just below sits an obvious swing low, and below that, daily demand.",
 c:[{x:"Buy now, stop just under the obvious swing low",s:"A tight stop where everyone else's is",k:"bad",r:-1,
     fb:"Price dipped under the swing low, straight through the cluster of stops, tagged daily demand and then ripped higher. You were stopped off with the other passengers, one station early."},
    {x:"Buy at daily demand, stop below the zone",s:"Board at the strong station, stop beyond it",k:"best",r:2.5,
     fb:"The probe through the swing low filled your order at daily demand. Your stop sat beyond the zone, out of reach, and price rallied hard as shorts piled in."},
    {x:"Sell with the crowd",s:"Short the pullback",k:"bad",r:-1,
     fb:"The pullback ended at demand. The crowd added more shorts on the way up, and so did you, until your stop went."}],
 lesson:"Every station has passengers getting off: that's where stops get probed. Put your stop beyond the strong level, not at the obvious one."},

{id:"tip",pair:"GBPJPY",title:"A tip on the platform",
 trail:[55,62,69,74],next:[79,83,86],
 price:{pts:[72,68,63,58,54,50,53,57,60,61],after:[57,52,47,42,38,35],zone:[58,66,"Daily supply","supply"]},
 story:"A busy trading chat lights up: <b>\"BUY GBPJPY NOW, ROCKET INCOMING\"</b>. The GBPJPY crowd is already <b>74% long</b> and getting longer. Price has bounced into daily supply and stalled.",
 c:[{x:"Buy on the tip",s:"Hop on: everyone says it's going up",k:"bad",r:-1,
     fb:"The rocket never launched. Supply held, and you joined the 74% who were heading for the same exit."},
    {x:"Sell at daily supply",s:"Board southbound, the opposite way to the tip",k:"best",r:2,
     fb:"The crowd bought the tip, and pushed to 86% long as price fell from supply. Their buying was your fuel."},
    {x:"Wait on the platform",s:"Ignore the noise, take nothing",k:"ok",r:0,
     fb:"Ignoring the tip was right. But the board was telling you to sell at supply, and the trade worked."}],
 lesson:"The crowd reads the same tips you do. That's exactly who is on the train."},

{id:"terminus",pair:"EURGBP",title:"King's Cross: the end of the line",
 trail:[78,85,90,94,96],next:[93,88,84],
 price:{pts:[80,76,70,66,60,55,48,42,36,30,26,24],after:[22,27,32,30,36,42,48,53],zone:[14,26,"Weekly demand","demand"]},
 story:"<b>96% of EURGBP traders are long.</b> They have bought the whole way down, and price has now fallen into weekly demand. The easy reading: everyone's long, so sell. But look at the board: the train is pulling into King's Cross.",
 c:[{x:"Sell: everyone's long, so fade them",s:"Buy a ticket for the last few yards",k:"bad",r:-1.2,
     fb:"There was no track left. It can't get to 100% long, because then there'd be no one to sell to. Price bounced off weekly demand and your late short was stopped out as the train reversed."},
    {x:"Buy at weekly demand after a bullish close, stop below the zone",s:"Board the return train at a strong station",k:"best",r:2,
     fb:"All change. The crowd started to unwind, from 96% to 84% long, and price climbed out of weekly demand. You boarded the return journey right at the start."},
    {x:"Wait on the platform",s:"Too extreme to touch",k:"ok",r:0,
     fb:"Not selling was the main thing. But the terminus plus weekly demand was the cleanest boarding point on the line."}],
 lesson:"96% long is King's Cross. It can't go to 100%, or there'd be no market. There's no gas left in the tank, so get ready for the return journey."},

{id:"return",pair:"EURGBP",title:"The return journey",
 trail:[96,93,88,84],next:[79,73,66],
 price:{pts:[24,22,28,34,40,46,52,48,45,43],after:[46,52,58,63,68,72],zone:[38,45,"Daily demand","demand"]},
 story:"A few days later. EURGBP is still <b>84% long</b>, which sounds bearish. But the train has turned: <b>96, 93, 88, 84</b>. It's heading north now. Price climbed out of weekly demand and has pulled back into daily demand.",
 c:[{x:"Buy at the daily demand retest",s:"Board northbound at the next strong station",k:"best",r:2,
     fb:"Longs kept bailing as price rose, 84% down to 66%, and every one of them selling was fuel for your buy. Right direction, right station."},
    {x:"Wait for a breakout above the recent high, then buy",s:"Board late, between stations",k:"ok",r:0.5,
     fb:"It worked, but you paid up. Your stop had to sit far below, so the same move earned a fraction of what the demand entry did."},
    {x:"Sell: 84% long is still very long",s:"Read the level, ignore the direction",k:"bad",r:-1,
     fb:"84% long was a reading of where the train was, not where it was going. It was heading north, and you were standing on the tracks."}],
 lesson:"Where the train is heading matters more than where it is. 84% and falling is a train leaving King's Cross."},

{id:"edinburgh",pair:"XAUUSD",title:"Edinburgh: the other end",
 trail:[28,20,14,11,9],next:[13,19,26],
 price:{pts:[20,24,30,36,42,50,56,62,68,72,76],after:[78,73,66,60,54,49],zone:[74,84,"Weekly supply","supply"]},
 story:"Gold has rallied for weeks and the crowd has shorted every step. <b>Only 9% are long</b> now. Price has run into weekly supply. This is the other terminus: Edinburgh Waverley.",
 c:[{x:"Buy: everyone's short, so fade them",s:"Catch the last few yards north",k:"bad",r:-1.2,
     fb:"The end of the line. Shorts started covering into weekly supply, price turned lower, and your late long was stopped out."},
    {x:"Sell at weekly supply after a bearish close, stop above the zone",s:"Board the return train south",k:"best",r:2,
     fb:"The shorts took profit, the crowd drifted back towards 26% long, and price fell away from weekly supply. You caught the return journey."},
    {x:"Wait on the platform",s:"Sit this one out",k:"ok",r:0,
     fb:"Safe, and better than buying the top. The terminus plus weekly supply was the trade, though."}],
 lesson:"Both ends of the line are termini. Near 0% or 100%, stop thinking 'fade the crowd' and start thinking 'return journey'."},

{id:"circles",pair:"US500",title:"Going round in circles",
 trail:[48,53,49,52,50],next:[47,52,49],
 price:{pts:[50,55,48,53,47,52,49,54,50],after:[46,53,48,55,50,47],zone:null},
 story:"The US500 crowd can't decide: <b>48, 53, 49, 52, 50% long</b>. The train is shunting back and forth around York. Price is chopping in the middle of a range, with no strong level nearby.",
 c:[{x:"Buy the dip",s:"Pick a direction and go",k:"bad",r:-0.5,
     fb:"Chop. You were stopped out on a small swing, and the train hadn't moved."},
    {x:"Sell the rip",s:"Pick the other direction",k:"bad",r:-0.5,
     fb:"Chop the other way. Small loss, no journey."},
    {x:"Wait until the train picks a direction and reaches a station",s:"No journey, no trade",k:"best",r:0,
     fb:"Exactly. No direction of travel and no strong level means no ticket. The best trade here was none."}],
 lesson:"No journey, no trade. The train has to be going somewhere, and you have to be at a station."}
];
const PTS={best:100,ok:40,bad:0};

/* ======================= HELPERS ======================= */
const app=document.getElementById("app"), hudEl=document.getElementById("hud");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sR=r=>(r>0?"+":r<0?"−":"")+Math.abs(r).toFixed(1)+"R";
const REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function gc(n){try{window.QDBGames&&QDBGames.track(n)}catch(e){}}

let S=null;
function hud(){
  if(!S){hudEl.innerHTML="";return}
  hudEl.innerHTML=`<span>Journey <b>${Math.min(S.i+1,J.length)}/${J.length}</b></span><span>Score <b>${S.pts}</b></span><span>Total <b>${sR(S.r)}</b></span>`;
}

/* ======================= TRACK SVG ======================= */
function compact(){return (app.clientWidth||600)<600}
function trackSVG(j,showNext){
  const C=compact(), W=C?520:1000, H=C?250:240, L=C?34:56, R=W-(C?34:56), Y=122;
  const x=p=>L+(R-L)*p/100;
  const now=j.trail[j.trail.length-1], prev=j.trail[j.trail.length-2];
  const south=now>=prev; // heading to King's Cross
  const fs=C?20:17, fsm=C?16:14;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Railway line from Edinburgh at 0 percent long to London King's Cross at 100 percent long. The ${esc(j.pair)} crowd train is at ${now} percent long, near ${esc(stationAt(now)[2])}, heading ${south?"south to King's Cross":"north to Edinburgh"}.">`;
  // terminus zones
  g+=`<rect x="${x(0)-14}" y="${Y-46}" width="${x(12)-x(0)+14}" height="92" rx="10" fill="rgba(255,176,0,.07)" stroke="rgba(255,176,0,.25)" stroke-dasharray="4 5"/>`;
  g+=`<rect x="${x(88)}" y="${Y-46}" width="${x(100)-x(88)+14}" height="92" rx="10" fill="rgba(255,176,0,.07)" stroke="rgba(255,176,0,.25)" stroke-dasharray="4 5"/>`;
  // sleepers + rails
  for(let p=0;p<=100;p+=1.6) g+=`<rect x="${x(p)-2}" y="${Y-11}" width="4" height="22" fill="#2a3349"/>`;
  g+=`<line x1="${x(0)}" x2="${x(100)}" y1="${Y-6}" y2="${Y-6}" stroke="var(--rail)" stroke-width="3"/><line x1="${x(0)}" x2="${x(100)}" y1="${Y+6}" y2="${Y+6}" stroke="var(--rail)" stroke-width="3"/>`;
  // buffers
  [[0,-1],[100,1]].forEach(([p,d])=>{const bx=x(p)+d*10;g+=`<rect x="${bx-5}" y="${Y-18}" width="10" height="36" rx="2" fill="#c0392b" stroke="#000" stroke-width="1.5"/><rect x="${bx-9}" y="${Y-14}" width="18" height="6" fill="#ffd166"/><rect x="${bx-9}" y="${Y+8}" width="18" height="6" fill="#ffd166"/>`});
  // stations
  STATIONS.forEach(([p,short,full],i)=>{
    const show=!C||[0,20,50,80,100].includes(p);
    const up=C?(p===0||p===100):i%2===0, ty=up?Y-34:Y+46;
    g+=`<circle cx="${x(p)}" cy="${Y}" r="${p%50===0?7:5}" fill="#0b111d" stroke="${p===0||p===100?"var(--amber)":"#8b97ad"}" stroke-width="2.5"/>`;
    if(show){
      const anchor=p===0?"start":p===100?"end":"middle", lx=p===0?x(p)-14:p===100?x(p)+14:x(p);
      g+=`<text x="${lx}" y="${ty}" text-anchor="${anchor}" font-family="Space Grotesk, sans-serif" font-size="${fs}" font-weight="${p===0||p===100?700:500}" fill="${p===0||p===100?"#ffd27a":"#c9d2e3"}">${esc(short)}</text>`;
    }
  });
  // % scale
  for(let p=0;p<=100;p+=C?25:10) g+=`<text x="${x(p)}" y="${H-10}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="${fsm}" fill="#6b7892">${p}%</text>`;
  if(!C) g+=`<text x="${x(0)-14}" y="${C?24:22}" font-family="JetBrains Mono, monospace" font-size="${fsm}" fill="#8a6a1e">ALL SHORT ←</text>`;
  if(!C) g+=`<text x="${x(100)+14}" y="${C?24:22}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="${fsm}" fill="#8a6a1e">→ ALL LONG</text>`;
  // trail dots
  j.trail.slice(0,-1).forEach((p,i,arr)=>{g+=`<circle cx="${x(p)}" cy="${Y}" r="4" fill="var(--amber)" opacity="${.25+.5*i/arr.length}"/>`});
  if(showNext) j.next.forEach((p,i)=>{g+=`<circle cx="${x(p)}" cy="${Y}" r="4" fill="#7dd3fc" opacity="${.5+.15*i}"/>`});
  // passengers layer + train
  g+=`<g id="pax"></g>`;
  g+=`<g id="train" data-x0="${L}" data-x1="${R}" data-y="${Y}" transform="translate(${x(now)} ${Y})">${trainShape(south)}</g>`;
  // terminus sign
  if(now>=88||now<=12){
    const kx=now>=88, sw=C?300:244, sx=kx?x(100)+14-sw:x(0)-14;
    g+=`<g class="blink"><rect x="${sx}" y="${C?14:30}" width="${sw}" height="${C?34:28}" rx="5" fill="#090b0f" stroke="var(--amber)" stroke-width="1.5"/><text x="${sx+sw/2}" y="${C?37:50}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="${C?17:14}" font-weight="700" fill="var(--amber)">ALL CHANGE · TERMINATES HERE</text></g>`;
  }
  return g+"</svg>";
}
function trainShape(south){
  // drawn facing right (south); flipped for north
  const f=south?1:-1;
  return `<g transform="scale(${f} 1)">
    <rect x="-86" y="-30" width="38" height="22" rx="4" fill="#1d4ed8" stroke="#0b1226" stroke-width="2"/>
    <rect x="-82" y="-26" width="9" height="8" rx="1.5" fill="#bfdbfe"/><rect x="-70" y="-26" width="9" height="8" rx="1.5" fill="#bfdbfe"/><rect x="-58" y="-26" width="7" height="8" rx="1.5" fill="#bfdbfe"/>
    <rect x="-46" y="-30" width="38" height="22" rx="4" fill="#1d4ed8" stroke="#0b1226" stroke-width="2"/>
    <rect x="-42" y="-26" width="9" height="8" rx="1.5" fill="#bfdbfe"/><rect x="-30" y="-26" width="9" height="8" rx="1.5" fill="#bfdbfe"/><rect x="-18" y="-26" width="7" height="8" rx="1.5" fill="#bfdbfe"/>
    <path d="M-6 -30 h18 q16 0 20 16 v6 h-38 z" fill="#f5b83d" stroke="#0b1226" stroke-width="2"/>
    <rect x="2" y="-26" width="12" height="8" rx="2" fill="#0b1226"/>
    <circle cx="29" cy="-12" r="2.5" fill="#fff7cc"/>
    <g fill="#0b1226">${[-78,-58,-38,-18,2,20].map(c=>`<circle cx="${c}" cy="-6" r="4"/>`).join("")}</g>
  </g>`;
}
function moveTrain(path,done){
  const t=document.getElementById("train"); if(!t){done&&done();return}
  const x0=+t.dataset.x0,x1=+t.dataset.x1,y=+t.dataset.y,X=p=>x0+(x1-x0)*p/100;
  if(REDUCED||path.length<2){t.setAttribute("transform",`translate(${X(path[path.length-1])} ${y})`);done&&done();return}
  const pax=document.getElementById("pax"); let seg=0,t0=null;const dur=650;
  const passed=new Set();
  function frame(ts){
    if(t0===null)t0=ts; let k=(ts-t0)/dur;
    if(k>=1){seg++;t0=ts;k=0; if(seg>=path.length-1){t.setAttribute("transform",`translate(${X(path[path.length-1])} ${y})`);done&&done();return}}
    const a=path[seg],b=path[seg+1],e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,p=a+(b-a)*e;
    t.innerHTML=trainShape(b>=a);
    t.setAttribute("transform",`translate(${X(p)} ${y})`);
    STATIONS.forEach(([sp])=>{ if(!passed.has(sp)&&Math.abs(p-sp)<1.2&&sp>0&&sp<100){passed.add(sp);dropPax(pax,X(sp),y)} });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function dropPax(layer,px,y){
  // a passenger stopped off at the station: a stop-loss probe
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.innerHTML=`<circle cx="0" cy="-8" r="4" fill="#ef4444"/><rect x="-3.5" y="-4" width="7" height="10" rx="3" fill="#ef4444"/><text x="0" y="-16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#ef4444">SL</text>`;
  layer.appendChild(g); let t0=null;
  function f(ts){if(t0===null)t0=ts;const k=Math.min(1,(ts-t0)/900);g.setAttribute("transform",`translate(${px} ${y+18+k*30})`);g.setAttribute("opacity",String(1-k));if(k<1)requestAnimationFrame(f);else g.remove()}
  requestAnimationFrame(f);
}

/* ======================= PRICE SVG ======================= */
function priceSVG(j,reveal){
  const C=compact(), W=C?560:960, H=C?300:260, L=12, R=W-(C?50:70), T=24, B=H-30, F=C?21:18, Fs=C?17:14;
  const all=j.price.pts.concat(j.price.after), n=all.length-1;
  const lo=Math.min(...all,j.price.zone?j.price.zone[0]:100)-6, hi=Math.max(...all,j.price.zone?j.price.zone[1]:0)+6;
  const X=i=>L+(R-L)*i/n, Y=v=>T+(hi-v)/(hi-lo)*(B-T);
  const past=j.price.pts, k=past.length-1;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Illustrative ${esc(j.pair)} price path${j.price.zone?` with ${esc(j.price.zone[2])}`:""}">`;
  g+=`<rect width="${W}" height="${H}" rx="12" fill="#0f1626"/>`;
  if(j.price.zone){const [z0,z1,lab,kind]=j.price.zone,col=kind==="demand"?"34,197,94":"239,68,68";
    g+=`<rect x="${L}" y="${Y(z1)}" width="${R-L+6}" height="${Y(z0)-Y(z1)}" fill="rgba(${col},.16)" stroke="rgba(${col},.55)" stroke-dasharray="6 4"/>`;
    g+=`<text x="${L+12}" y="${(Y(z0)+Y(z1))/2+F*0.35}" font-family="Space Grotesk, sans-serif" font-size="${F}" font-weight="700" fill="rgb(${col})">${esc(lab)}</text>`}
  if(j.price.stopline){const [v,lab]=j.price.stopline;g+=`<line x1="${L}" x2="${R+6}" y1="${Y(v)}" y2="${Y(v)}" stroke="#f5b83d" stroke-width="2" stroke-dasharray="3 5"/><text x="${L+12}" y="${Y(v)-7}" font-family="Space Grotesk, sans-serif" font-size="${Fs+1}" font-weight="600" fill="#f5b83d">${esc(lab)}</text>`}
  const path=(arr,o)=>arr.map((v,i)=>(i?"L":"M")+X(i+o).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  g+=`<path d="${path(past,0)}" fill="none" stroke="#e8edf6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(reveal) g+=`<path d="${path([past[k]].concat(j.price.after),k)}" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"/>`;
  g+=`<circle cx="${X(k)}" cy="${Y(past[k])}" r="6" fill="var(--amber)" stroke="#0b0f17" stroke-width="2"/>`;
  g+=`<text x="${X(k)}" y="${Y(past[k])-12}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="${Fs+1}" font-weight="700" fill="var(--amber)">NOW</text>`;
  g+=`<text x="${L+8}" y="${H-9}" font-family="JetBrains Mono, monospace" font-size="${Fs}" fill="#6b7892">${esc(j.pair)} · illustrative${reveal?" · dashed = what happened next":""}</text>`;
  return g+"</svg>";
}

/* ======================= SCREENS ======================= */
function boardHTML(j,after){
  const now=after?j.next[j.next.length-1]:j.trail[j.trail.length-1];
  const seq=after?[j.trail[j.trail.length-1]].concat(j.next):j.trail;
  const south=seq[seq.length-1]>=seq[seq.length-2];
  const st=stationAt(now);
  const term=now>=88?"KING'S CROSS: END OF THE LINE":now<=12?"EDINBURGH: END OF THE LINE":south?"KING'S CROSS":"EDINBURGH";
  return `<div class="board" role="group" aria-label="Departure board">
    <div class="r"><span>Service</span><b class="big">${esc(j.pair)} crowd</b></div>
    <div class="r"><span>Retail long</span><b>${now}%</b></div>
    <div class="r"><span>Now at</span><b>${esc(st[2])}</b></div>
    <div class="r"><span>Heading</span><b class="${now>=88||now<=12?"blink":""}">${south?"→":"←"} ${term}</b></div>
    <div class="r"><span>Recent readings</span><b>${seq.map(v=>v+"%").join(" › ")}</b></div>
  </div>`;
}

function startScreen(){
  S=null; hud();
  const best=store("cx_best");
  const demo={pair:"EURGBP",trail:[60,72,85,96],next:[]};
  app.innerHTML=`<p class="mono" style="color:var(--amber);font-size:14px;letter-spacing:.08em">A FREE QDB GAME · 8 JOURNEYS · ABOUT 6 MINUTES</p>
  <h1 style="margin-top:8px">All aboard the <em>Crowd Express</em></h1>
  <p class="lead">Retail sentiment runs like a train on the line from Edinburgh to London King's Cross. It leaves one end at 0% long and rolls towards 100%, dropping passengers off at every station along the way. Then it turns round and does it again. Forever.</p>
  <div class="trackbox" id="demoTrack">${trackSVG(demo,false)}</div>
  <div class="legend"><span><i style="background:var(--amber);opacity:.6"></i>Where the crowd has been</span><span><i style="background:#1d4ed8"></i>Where it is now</span><span><i style="background:#ef4444"></i>Passengers stopped off</span></div>
  <div class="rules">
    <div class="rule"><div class="n">1</div><div><b>The train is the retail crowd</b><span>Edinburgh Waverley is 0% long (everyone short). London King's Cross is 100% long. Heading south means the crowd is buying; heading north means it's selling.</span></div></div>
    <div class="rule"><div class="n">2</div><div><b>Most passengers don't know where it's going</b><span>They hop on mid-journey, and at every station some get stopped off. Those are the stop-loss probes. Their buying and selling is the fuel for the move.</span></div></div>
    <div class="rule"><div class="n">3</div><div><b>It can't go past the buffers</b><span>The crowd can never be 100% long, or there'd be no market. At 90%+ (or 10% and below) there's not much gas left in the tank. All change: the return journey is next.</span></div></div>
    <div class="rule"><div class="n">4</div><div><b>Board at a strong station</b><span>Get on at a strong technical level, like weekly or daily demand and supply. Not between stations, and not for the last few yards before the buffers.</span></div></div>
  </div>
  <div class="row"><button class="btn primary" onclick="begin()">Start the first journey</button><a class="btn" href="../../guides/retail-sentiment/?ref=game-crowd-express">Read the guide first</a><a class="btn" href="../">More games</a></div>
  ${best?`<p class="muted" style="margin-top:12px;font-size:16px">Your best: ${best.pts} points (${esc(best.g)}).</p>`:""}
  <p class="foot">Educational only, not financial advice. Pairs, sentiment readings and price paths are illustrative, written to teach the idea. Sentiment is one input, not a signal on its own.</p>`;
  window.scrollTo({top:0});
  setTimeout(()=>moveTrain([60,72,85,96]),300);
}

function begin(){
  S={i:0,pts:0,r:0,pax:0,log:[]}; gc("start-crowd-express");
  try{QDBGames.showFooter()}catch(e){}
  show();
}

let ORDER=null;
function show(){
  const j=J[S.i]; hud(); window.scrollTo({top:0});
  ORDER=shuffle(j.c.map((_,k)=>k),rng(S.i*97+13));
  app.innerHTML=`<p class="mono muted" style="font-size:14px;letter-spacing:.06em">JOURNEY ${S.i+1} OF ${J.length}</p>
  <h2 style="margin:4px 0 12px">${esc(j.title)}</h2>
  ${boardHTML(j,false)}
  <div class="trackbox">${trackSVG(j,false)}</div>
  <div class="price card" style="padding:12px"><div class="pricehead"><span>Price: <b>${esc(j.pair)}</b></span><span>${j.price.zone?`Nearest strong level: <b>${esc(j.price.zone[2])}</b>`:"No strong level nearby"}</span></div>${priceSVG(j,false)}</div>
  <p class="story">${j.story}</p>
  <div class="choices">${ORDER.map((k,i)=>`<button class="choice" onclick="choose(${k})"><span class="k">${"ABC"[i]}</span><span>${esc(j.c[k].x)}<small>${esc(j.c[k].s)}</small></span></button>`).join("")}</div>`;
  const tr=j.trail; setTimeout(()=>moveTrain(tr.length>1?[tr[tr.length-2],tr[tr.length-1]]:tr),200);
}

function choose(k){
  const j=J[S.i], c=j.c[k];
  S.pts+=PTS[c.k]; S.r+=c.r; S.log.push({j,c});
  { const seq=[j.trail[0]].concat(j.trail.slice(1),j.next); for(let i=1;i<seq.length;i++){const lo=Math.min(seq[i-1],seq[i]),hi=Math.max(seq[i-1],seq[i]); S.pax+=STATIONS.filter(st=>st[0]>lo&&st[0]<=hi&&st[0]>0&&st[0]<100).length;} }
  hud(); window.scrollTo({top:0});
  const stamp={best:"Right train, right station",ok:"Safe on the platform",bad:"Wrong train"}[c.k];
  const best=j.c.find(x=>x.k==="best");
  const now=j.trail[j.trail.length-1];
  app.innerHTML=`<p class="mono muted" style="font-size:14px;letter-spacing:.06em">JOURNEY ${S.i+1} OF ${J.length} · ${esc(j.pair)}</p>
  <div class="card result" style="margin-top:8px">
    <span class="stamp ${c.k}">${stamp}</span>
    <h2>${esc(c.x)}</h2>
    <div class="rline ${c.r>0?"g":c.r<0?"r":"n"}">${sR(c.r)} · +${PTS[c.k]} points</div>
    <p>${esc(c.fb)}</p>
    ${c.k!=="best"?`<p class="muted" style="margin-top:10px;font-size:17px">The best ticket: ${esc(best.x)} (${sR(best.r)}).</p>`:""}
    <div class="note"><h4>Conductor's note</h4><p>${esc(j.lesson)}</p></div>
  </div>
  <div class="trackbox">${trackSVG(j,true)}</div>
  ${boardHTML(j,true)}
  <div class="price card" style="padding:12px;margin-top:12px">${priceSVG(j,true)}</div>
  <div class="row"><button class="btn primary" onclick="next()">${S.i+1<J.length?"Next journey":"See your ticket"}</button></div>`;
  setTimeout(()=>moveTrain([now].concat(j.next)),250);
}
function next(){S.i++; if(S.i<J.length) show(); else end()}

function gradeOf(p){return p>=760?["Station master","You read the board like a pro: the right train, at the right station, and you stayed off it at the buffers."]
  :p>=560?["Season-ticket holder","You know the line well. A couple of boarding points to tighten up."]
  :p>=360?["Day tripper","You've got the idea of fading the crowd. Now learn where the line ends, and board only at strong stations."]
  :["Lost on the platform","Most retail traders ride this train without knowing where it's going. Try again with the four rules in mind."]}

function end(){
  const [g,msg]=gradeOf(S.pts), max=J.length*100, bestN=S.log.filter(x=>x.c.k==="best").length;
  const prev=store("cx_best"); if(!prev||S.pts>prev.pts) store("cx_best",{pts:S.pts,g});
  hud(); window.scrollTo({top:0}); gc("finish-crowd-express");
  app.innerHTML=`<p class="mono muted" style="font-size:14px;letter-spacing:.06em">YOUR TICKET</p>
  <div class="grade" style="margin-top:6px">${S.pts}<span style="font-size:.35em;color:var(--muted)">/${max}</span></div>
  <h2 style="margin-top:6px">${esc(g)}</h2>
  <p class="lead" style="margin-top:8px">${esc(msg)}</p>
  <div class="kpis">
    <div class="kpi"><span>Best tickets</span><b>${bestN}/${J.length}</b></div>
    <div class="kpi"><span>Total result</span><b style="color:${S.r>=0?"var(--buy)":"var(--sell)"}">${sR(S.r)}</b></div>
    <div class="kpi"><span>Passengers stopped off</span><b>${S.pax}</b></div>
  </div>
  <div class="card" style="overflow-x:auto"><h3 style="margin-bottom:6px">Your journeys</h3>
  <table><tr><th>Journey</th><th>Your call</th><th class="n" style="text-align:right">Result</th></tr>
  ${S.log.map(({j,c})=>`<tr><td><b>${esc(j.pair)}</b><br><span class="muted" style="font-size:14px">${esc(j.title)}</span></td><td>${esc(c.x)}<br><span class="tag ${c.k}">${c.k==="best"?"Best":c.k==="ok"?"Safe":"Wrong train"}</span></td><td class="n">${sR(c.r)}</td></tr>`).join("")}
  </table></div>
  <div class="cta"><h3>Where is every train right now?</h3>
    <p style="margin-top:6px">The QDB Sheet tracks retail positioning across 28+ FX pairs, indices and gold through the trading day: how long the crowd is, which way it's heading, and when it's coming off an extreme. The Newtonian view even flags when a crowd is "coming off the upper spring".</p>
    <div class="row"><a class="btn primary" href="../../?ref=game-crowd-express#pricing">See the QDB Sheet</a><button class="btn" onclick="begin()">Ride again</button><a class="btn" href="../">More games</a></div>
  </div>
  <div id="shareSlot"></div>
  <p class="foot">Educational only, not financial advice. Pairs, sentiment readings and price paths are illustrative, written to teach the idea. Sentiment is one input, not a signal on its own.</p>`;
  try{QDBGames.mount(document.getElementById("shareSlot"),{text:`I scored ${S.pts}/${max} on the Crowd Express and made ${g}. Retail sentiment runs like a train from 0% to 100% long and back. Can you tell when it's about to terminate?`})}catch(e){}
}

startScreen();
</script>
