name: Blog hand-written posts

# Builds pages from Markdown posts in blog/_write/ (see blog/_write/README.md).
on:
  push:
    branches: [main]
    paths:
      - "blog/_write/**"
  workflow_dispatch:
  pull_request:
    paths:
      - "blog/_write/**"
      - "scripts/blog_manual.py"
      - "scripts/blog_auto.py"
      - ".github/workflows/blog-write.yml"

permissions:
  contents: write

concurrency:
  group: blog-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet markdown

      - name: Build check (pull requests only, nothing is committed)
        if: github.event_name == 'pull_request'
        run: |
          cp blog/_write/TEMPLATE.md blog/_write/template-check.md
          python3 scripts/blog_manual.py --check

      - name: Build posts
        if: github.event_name != 'pull_request'
        run: python3 scripts/blog_manual.py

      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "qdb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Blog: build hand-written posts"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*5))
          done
          exit 1
